# Single-package repo: pnpm 9 (e.g. older Cloudflare Workers Builds images)
# rejects a pnpm-workspace.yaml without a "packages" field
packages:
  - "."

# pnpm 11+ (no longer reads engine-strict from .npmrc)
engineStrict: true

allowBuilds:
  esbuild: true
  sharp: false
  workerd: false

# pnpm 10 (e.g. Cloudflare Workers Builds default) - removed in pnpm 11
onlyBuiltDependencies:
  - esbuild
